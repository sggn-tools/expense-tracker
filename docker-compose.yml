version: "3.9"

# ─────────────────────────────────────────
# Solo base de datos. La app Next.js corre
# localmente con: npm run dev
#
# Comandos:
#   Levantar DB:   docker compose up -d
#   Detener DB:    docker compose down
#   Con Adminer:   docker compose --profile tools up -d
# ─────────────────────────────────────────

services:
  db:
    image: mysql:8.0
    container_name: expense_tracker_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"  # Expuesto en localhost:3306 para la app local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Adminer — GUI opcional para MySQL
  # Iniciar con: docker compose --profile tools up -d
  # ─────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: expense_tracker_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    profiles:
      - tools

volumes:
  mysql_data:
    driver: local
